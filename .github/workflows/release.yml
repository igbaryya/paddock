# Releases the desktop app on every push to main that changes it: tags the commit with the next
# version, builds it for macOS and Windows, uploads the installers and the update feed to a draft
# GitHub release, and publishes it once both builds have succeeded. Publishing is what puts it on the
# download site and in front of every installed app; a build that fails on either OS leaves the draft
# unpublished, so nobody gets half a release.
#
# The version lives in the tags, not in package.json: each release is the patch after the highest v*
# tag. A minor or major release is made by raising the version in the root package.json.
#
# Signing is optional here and warned about when missing — an unsigned build is still useful to test,
# but Gatekeeper and SmartScreen block it, and macOS will not update an unsigned app. What to set is in
# README.md → Desktop app → Releasing.
name: Release desktop app

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
      - 'test/**'
      - '.cursor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, each reading the tags the last one pushed. A push while one runs waits, and a
# newer push replaces it in the queue — its commit ships everything the replaced one would have.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      # A commit that is already tagged keeps its tag, so re-running a failed release retries that
      # version instead of shipping the same code as a new one.
      - name: Next version
        id: version
        run: |
          tagged="$(git tag --list 'v*' --points-at HEAD | head -1)"
          if [ -n "$tagged" ]; then
            echo "tag=$tagged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          declared="$(node -p "require('./package.json').version")"
          released="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)"
          highest="$(printf '%s\n' "$declared" "$released" | sort -V | tail -1)"
          if [ "$highest" != "$released" ]; then
            echo "tag=v$declared" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "$released"
          echo "tag=v$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

      # Pushed with the workflow's token, which starts no other workflow: this run is what builds it.
      - name: Tag the pushed commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null && exit 0
          git tag "$TAG"
          git push origin "$TAG"

      # Created once, here: two builds each creating it would race and leave two drafts.
      - name: Draft release for both builds to upload into
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "Paddock ${TAG#v}"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            desktop/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix ui
          npm ci --prefix desktop

      # electron-builder takes the app's version from the root package, and uploads to the release
      # tagged with it.
      - name: Version the build
        shell: bash
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # Before the tests: the HTTP suite serves the built dashboard.
      - name: Build the dashboard
        run: npm run build

      # The suite is POSIX-first (README → Platform support), so it gates the release from macOS.
      - name: Test
        if: runner.os == 'macOS'
        run: npm test

      # Last before the build, so no install script ever runs with the signing material in its environment.
      - name: macOS signing and notarisation
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_CERTIFICATE" ]; then
            echo "::warning::MAC_CERTIFICATE is not set: this macOS build is unsigned. Gatekeeper blocks it, and it cannot update itself."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          # Imported here rather than through CSC_LINK: electron-builder unlocks its own keychain with
          # the certificate's password instead of the keychain's, which macOS 26 refuses. It signs with
          # the identity it finds in CSC_KEYCHAIN instead.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MAC_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A certificate without its key imports fine and then signs nothing; stop here instead.
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            echo "::error::MAC_CERTIFICATE holds no Developer ID Application identity with its private key."
            exit 1
          fi
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          if [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "::warning::APPLE_API_KEY is not set: this macOS build is signed but not notarised, and Gatekeeper blocks it."
            exit 0
          fi
          key_file="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_file"
          {
            echo "APPLE_API_KEY=$key_file"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -z "$AZURE_SIGNING_ENDPOINT" ]; then
            echo "::warning::AZURE_SIGNING_ENDPOINT is not set: this Windows build is unsigned, and SmartScreen warns before running it."
            exit 0
          fi
          for name in AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE AZURE_SIGNING_PUBLISHER \
                      AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      - name: Build and upload to the draft release
        run: npm --prefix desktop run dist -- --publish always
        env:
          GH_TOKEN: ${{ github.token }}

  # Only after every build: `needs` a matrix waits for all of it, and skips this if any leg failed.
  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
